services:
  db:
    image: postgres:17-alpine
    container_name: warung-pintar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: warung_pintar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - warung_pintar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warung_pintar"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  warung_pintar_pgdata:
